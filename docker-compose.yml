version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: greenledger-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: greenledger

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenledger-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/greenledger
      JWT_SECRET: greenledger_super_secret_change_in_prod_2024
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenledger-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads:
